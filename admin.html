<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Orders – The Victoria Grand</title>
<style>
*{box-sizing:border-box;margin:0}body{font:15px/1.5 system-ui,sans-serif;background:#ecdfc4;color:#2b211a;padding:12px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto 12px}.top h1{font-size:1.3rem;margin-right:auto}
button,select{font:inherit;cursor:pointer}.chip{border:1px solid #d9c9a5;background:#fff;border-radius:99px;padding:6px 14px}.chip.on{background:#eba43a;border-color:#eba43a}
#login{max-width:340px;margin:60px auto;background:#fffaf0;padding:22px;border-radius:14px}#login input{width:100%;padding:10px;margin:10px 0;border:1px solid #d9c9a5;border-radius:8px;font:inherit}
.btn{background:#eba43a;border:0;border-radius:99px;padding:10px 20px;font-weight:600}
#list{max-width:900px;margin:auto;display:grid;gap:12px}
.o{background:#fffaf0;border-radius:14px;padding:16px;border-left:6px solid #eba43a}.o.delivered{border-color:#6b9a3a;opacity:.75}.o.cancelled{border-color:#c4561b;opacity:.6}.o.awaiting_payment{border-color:#8a7a68}.o.cancelled.refund{opacity:1}.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;background:#eee}.tag.g{background:#dfe8cc}.tag.r{background:#f6d5c8}.tag.w{background:#fbecc8}.o.confirmed{border-color:#d1371f}
.oh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}.mut{color:#8a7a68;font-size:.85rem}
.o ul{margin:8px 0 8px 18px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.row button{border:1px solid #d9c9a5;background:#fff;border-radius:8px;padding:8px 12px}.row button.cur{background:#2b211a;color:#fff;border-color:#2b211a}.row button.x{color:#c4561b}
#msg{text-align:center;color:#8a7a68;padding:30px}
</style></head><body>
<div id="login"><h2>Staff login</h2><p class="mut">Enter the admin key (from <b>admin-key.txt</b> on the server).</p><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><button class="btn" id="go">Open orders</button><p id="err" class="mut" style="color:#c4561b"></p></div>
<div id="app" hidden>
 <div class="top"><h1>🧾 Orders</h1><button class="chip on" data-f="active">Active</button><button class="chip" data-f="all">All</button><button class="chip" id="snd">🔔 Sound on</button><button class="chip" id="out">Log out</button></div>
 <div id="list"></div><p id="msg"></p>
</div>
<script>
const $=s=>document.querySelector(s);
const ST=[['confirmed','New'],['preparing','Preparing'],['out','Out for delivery'],['delivered','Delivered']];
let key=sessionStorage.getItem('vg_key')||'',filter='active',seen=null,sound=true,timer;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'LKR '+Number(n).toLocaleString('en-US'),tm=t=>new Date(t).toLocaleString('en-US',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(_){}}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'x-admin-key':key,'Content-Type':'application/json'}});if(r.status==401){logout();throw new Error('auth')}return r.json()}
function logout(){sessionStorage.removeItem('vg_key');key='';clearInterval(timer);$('#app').hidden=true;$('#login').hidden=false}
async function load(){
 let list;try{list=await api('/api/admin/orders')}catch(e){if(e.message!='auth')$('#msg').textContent='Cannot reach server…';return}
 $('#msg').textContent='';
 const ids=new Set(list.map(o=>o.id));if(seen&&sound&&[...ids].some(i=>!seen.has(i)))beep();seen=ids;
 const shown=list.filter(o=>filter=='all'||(o.status!='delivered'&&o.status!='cancelled')||o.refund=='due');
 $('#list').innerHTML=shown.map(o=>`<div class="o ${esc(o.status)} ${o.refund=='due'?'refund':''}"><div class="oh"><span>${esc(o.id)} · ${esc(o.customer.name)}</span><span>${fmt(o.total)}</span></div>
 <div class="mut">${tm(o.createdAt)} · ${esc(o.customer.payment)} ${o.paid?'<span class="tag g">✅ PAID</span>':''}${o.status=='awaiting_payment'?'<span class="tag w">⏳ WAITING FOR CARD PAYMENT – do not start</span>':''}${o.refund=='due'?'<span class="tag r">💸 REFUND DUE</span>':''}${o.refund=='done'?'<span class="tag">refunded</span>':''}</div>
 <div style="margin-top:6px">📞 <a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a><br>${o.customer.email?'✉️ '+esc(o.customer.email)+'<br>':''}📍 ${esc(o.customer.address)}${o.customer.city?', '+esc(o.customer.city):''}${o.customer.postal?' '+esc(o.customer.postal):''}</div>
 <ul>${o.items.map(i=>`<li>${i.qty} × ${esc(i.name)} <span class="mut">(${fmt(i.price*i.qty)})</span></li>`).join('')}</ul>
 <div class="mut">Delivery ${fmt(o.delivery)}</div>
 <div class="row">${o.status=='awaiting_payment'?'':ST.map(([s,l])=>`<button class="${o.status==s?'cur':''}" data-id="${esc(o.id)}" data-s="${s}">${l}</button>`).join('')}${o.refund=='due'?`<button data-rf="${esc(o.id)}">Mark as refunded</button>`:''}<button class="x ${o.status=='cancelled'?'cur':''}" data-id="${esc(o.id)}" data-s="cancelled">Cancel</button></div></div>`).join('');
 if(!shown.length)$('#msg').textContent=filter=='all'?'No orders yet.':'No active orders. New orders appear here automatically.';
}
function start(){$('#login').hidden=true;$('#app').hidden=false;load();clearInterval(timer);timer=setInterval(load,5000)}
$('#go').onclick=async()=>{key=$('#key').value.trim();const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});if(r.ok){sessionStorage.setItem('vg_key',key);start()}else $('#err').textContent='Wrong key'};
$('#key').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#out').onclick=logout;
$('#snd').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔔 Sound on':'🔕 Sound off'};
document.addEventListener('click',async e=>{const rf=e.target.closest('[data-rf]');if(rf){await api('/api/admin/orders/'+rf.dataset.rf,{method:'PATCH',body:JSON.stringify({refunded:true})});load();return}
 const b=e.target.closest('[data-s]'),f=e.target.closest('[data-f]');
 if(f){filter=f.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x==f));load()}
 if(b){if(b.dataset.s=='cancelled'&&!confirm('Cancel this order?'))return;await api('/api/admin/orders/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.s})});load()}});
if(key)start();
</script></body></html>
